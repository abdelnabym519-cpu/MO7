name: Release Pipeline

# The authoritative MO7 release pipeline.
#
# It answers one question per run: is this commit fit to become a release
# candidate, and if so what exactly was built from it? Everything it concludes
# is written into evidence/ci/<run-id>/ and committed to the branch, so the
# release controller that promotes the candidate can verify — rather than
# trust — what CI decided.
#
# Triggers
#   push   release branches (main, dev, and the Arena working branch)
#   manual workflow_dispatch
#
# The evidence commit the pipeline makes is excluded from the trigger paths, so
# a run cannot start another run.
#
# Failure model
#   Each gate records its real result instead of aborting the run, so one run
#   yields a complete picture of why a commit is or is not releasable. The single
#   fail-closed decision is the last step: a verdict other than RELEASABLE fails
#   the job, and the evidence for that failure is committed before the job exits.
#   `workflow_dispatch` with strict=true turns every gate back into an aborting
#   gate for a caller that wants stop-at-first-failure behaviour.
on:
  push:
    branches:
      - main
      - dev
      - arena/01a0ff3f-mo7
    # What may change without a release run: the pipeline's own evidence (which
    # is what stops a run from triggering another run) and documentation.
    # Everything else runs the pipeline — including the release tooling under
    # docs-for-user/phase33-cicd/, which the first version of this filter
    # excluded. That was a real gap: a change to the build recipe or the gates
    # would have shipped without the pipeline ever validating it. The tooling
    # path is re-included explicitly below.
    paths:
      - "**"
      - "!evidence/**"
      - "!**/*.md"
      - "!docs-for-user/**"
      - "docs-for-user/phase33-cicd/**"
  workflow_dispatch:
    inputs:
      strict:
        description: "Treat known-red gates as blocking instead of reporting them"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  # The tools that must know where the checkout is (build recipe, artifact scan)
  # read this, so a release cannot accidentally be built or scanned against a
  # different tree than the one that was validated.
  MO7_CHECKOUT: ${{ github.workspace }}

jobs:
  release:
    name: Release pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      rc_id: ${{ steps.rc.outputs.rc_id }}
      artifact_sha256: ${{ steps.build.outputs.artifact_sha256 }}
      canonical_sha256: ${{ steps.build.outputs.canonical_sha256 }}
      verdict: ${{ steps.rc.outputs.verdict }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------- source
      - name: Source gate
        run: |
          mkdir -p /tmp/mo7-build
          python docs-for-user/phase33-cicd/rc_stage.py \
            --stage "the source gate" \
            --evidence /tmp/mo7-build/stage-source.json \
            --log /tmp/mo7-build/source-gate.log \
            --failure-hint "the release source is not a clean checkout of the event commit" \
            -- python docs-for-user/phase33-cicd/rc_source_gate.py --out /tmp/mo7-build/source.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ------------------------------------------------------------ validation
      - name: Install validation toolchain
        continue-on-error: ${{ !inputs.strict }}
        run: |
          mkdir -p /tmp/mo7-build
          python docs-for-user/phase33-cicd/rc_stage.py --stage "the validation toolchain installs" --evidence /tmp/mo7-build/stage-deps.json --log /tmp/mo7-build/deps.log --failure-hint "the declared dependencies did not install" -- bash docs-for-user/phase33-cicd/rc_install_toolchain.sh

      - name: Static checks (ruff on the product tree, import boundaries, architecture)
        continue-on-error: ${{ !inputs.strict }}
        id: static
        run: |
          set -euo pipefail
          mkdir -p /tmp/mo7-build
          # The product tree is the blocking scope: the repository's own Lint job
          # only triggers on product paths, so this is the same jurisdiction, not
          # a weaker one. The whole checkout is measured in the next step and
          # recorded, because this branch carries phase documentation tooling the
          # repository's own gate has never seen (finding P33-L1).
          python docs-for-user/phase33-cicd/rc_lint.py --scope product \
            --evidence /tmp/mo7-build/lint-product.json
          test "$(python -c "import json;print(json.load(open('/tmp/mo7-build/lint-product.json'))['clean'])")" = "True"
          lint-imports
          python scripts/check_architecture.py

      - name: Repository-wide lint (recorded, non-blocking)
        if: always()
        run: |
          mkdir -p /tmp/mo7-build
          python docs-for-user/phase33-cicd/rc_lint.py --scope repo \
            --evidence /tmp/mo7-build/lint-repo.json || true
          cat /tmp/mo7-build/lint-repo.json || true

      - name: Import, lazy-startup and worker-protocol checks
        continue-on-error: ${{ !inputs.strict }}
        id: imports
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python docs-for-user/phase33-cicd/rc_stage.py --stage "import, lazy-startup and worker-protocol checks" --evidence /tmp/mo7-build/stage-imports.json --log /tmp/mo7-build/imports.log --failure-hint "a module import, the lazy-startup guarantee or the isolated worker protocol broke" -- bash docs-for-user/phase33-cicd/rc_import_checks.sh

      - name: Python tests

        id: pytest
        continue-on-error: ${{ !inputs.strict }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p data/user/settings
          printf 'system:\n  language: en\nlogging:\n  level: WARNING\n' > data/user/settings/main.yaml
          if [ -f tests/fixtures/ci_model_catalog.json ]; then
            cp tests/fixtures/ci_model_catalog.json data/user/settings/model_catalog.json
          fi
          python -m pytest -q tests deeptutor/learning/tests \
            --junitxml=pytest-report.xml -p no:cacheprovider

      - name: Security checks (bandit, dependency consistency, secret scan)
        continue-on-error: ${{ !inputs.strict }}
        id: security
        run: |
          set -euo pipefail
          python -m bandit -q -r deeptutor -ll -f json -o bandit-report.json || true
          python -c 'import json,pathlib;report=json.loads(pathlib.Path("bandit-report.json").read_text() or "{}");high=[r for r in report.get("results",[]) if r.get("issue_severity")=="HIGH" and r.get("issue_confidence")=="HIGH"];print("bandit: %d findings, %d high/high"%(len(report.get("results",[])),len(high)));[print("  HIGH %s:%s %s %s"%(r["filename"],r["line_number"],r["test_id"],r["issue_text"][:120])) for r in high[:10]];pathlib.Path("bandit-summary.json").write_text(json.dumps({"findings":len(report.get("results",[])),"high_high":len(high),"high":[{"file":r["filename"],"line":r["line_number"],"test":r["test_id"],"text":r["issue_text"][:200]} for r in high]},indent=2))'
          test -s bandit-summary.json
          test "$(python -c "import json;print(json.load(open('bandit-summary.json'))['high_high'])")" = "0"
          # Dependency drift: the lockfiles the release is built from must be the
          # lockfiles in the commit (no implicit upgrade during the build).
          python docs-for-user/phase33-cicd/rc_stage.py --stage "dependency consistency (pip check)" --evidence /tmp/mo7-build/stage-pipcheck.json --log /tmp/mo7-build/pipcheck.log --failure-hint "the installed dependency set is inconsistent" -- pip check

      # ----------------------------------------------------------------- build
      - name: Install frontend dependencies
        continue-on-error: ${{ !inputs.strict }}
        working-directory: web
        run: |
          mkdir -p /tmp/mo7-build
          python ../docs-for-user/phase33-cicd/rc_stage.py --stage "frontend dependencies install from the lockfile" --evidence /tmp/mo7-build/stage-npm.json --log /tmp/mo7-build/npm-ci.log --failure-hint "npm ci could not install the committed lockfile" -- npm ci --legacy-peer-deps

      - name: Frontend deterministic gate
        continue-on-error: ${{ !inputs.strict }}
        id: frontend
        working-directory: web
        run: |
          mkdir -p /tmp/mo7-build
          python ../docs-for-user/phase33-cicd/rc_stage.py --stage "the frontend deterministic gate" --evidence /tmp/mo7-build/stage-frontend.json --log /tmp/mo7-build/frontend.log --failure-hint "the deterministic frontend gate (lint, types, i18n, contracts) reported failures" -- npm run check:fast

      - name: Prepare the offline build inputs
        id: buildinputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/mo7-build/fonts
          npm pack geist@1.7.2 @fontsource/lora@5.3.0 --pack-destination /tmp/mo7-build >/dev/null
          cd /tmp/mo7-build
          for f in *.tgz; do tar xzf "$f"; done
          cp package/dist/fonts/geist-sans/Geist-Variable.woff2 fonts/
          cp package/files/lora-latin-400-normal.woff2 fonts/
          cp package/files/lora-latin-500-normal.woff2 fonts/
          cp package/files/lora-latin-600-normal.woff2 fonts/
          ls -la fonts/
          echo "MO7_FONT_DIR=/tmp/mo7-build/fonts" >> "$GITHUB_ENV"
          echo "MO7_FONT_MOCK=/tmp/mo7-build/font-mock.cjs" >> "$GITHUB_ENV"

      - name: Write the offline font response module
        run: |
          set -euo pipefail
          sed 's|/home/user/mo7-cicd/fonts|/tmp/mo7-build/fonts|' \
            docs-for-user/phase33-cicd/font-mock.cjs > /tmp/mo7-build/font-mock.cjs
          node -e "const m=require('/tmp/mo7-build/font-mock.cjs'); console.log('font mock entries:', Object.keys(m).length)"

      - name: Build the release artifact
        id: build
        env:
          MO7_BUILD_PYTHON: python
          MO7_FONT_MOCK: /tmp/mo7-build/font-mock.cjs
          MO7_FONT_DIR: /tmp/mo7-build/fonts
        run: |
          set -euo pipefail
          bash docs-for-user/phase33-cicd/rc_build.sh \
            --checkout "$GITHUB_WORKSPACE" --out /tmp/mo7-build/out
          # The build manifest is published with the evidence: it is the only
          # artefact that lets another host verify that its own rebuild of this
          # commit is the same content as the artifact CI built (the wheel itself
          # cannot be fetched from here). It is a digest map, ~0.9 MiB gzipped.
          gzip -9 -c /tmp/mo7-build/out/manifest.json > /tmp/mo7-build/out/artifact-manifest.json.gz
          python -c 'import json,pathlib;r=json.loads(pathlib.Path("/tmp/mo7-build/out/build-report.json").read_text());print("artifact_sha256="+r["artifact_sha256"]);print("canonical_sha256="+r["artifact_manifest_sha256"]);print("artifact="+r["artifact"]);print("entries="+str(r["artifact_entries"]));print("version="+r["version"])' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT" | tail -5

      - name: Artifact contract
        continue-on-error: ${{ !inputs.strict }}
        id: contract
        run: |
          # Wrapped in rc_stage.py so the stage's own exit status becomes evidence:
          # the contract document is written before the script prints its summary,
          # and a crash in between must not leave a green document behind.
          set -euo pipefail
          python docs-for-user/phase33-cicd/rc_stage.py \
            --stage "the artifact contract holds" \
            --evidence /tmp/mo7-build/stage-contract.json \
            --log /tmp/mo7-build/contract.log \
            --failure-hint "the artifact does not meet the contract: a required file is missing, a forbidden file is present, or it does not install and start" \
            -- python docs-for-user/phase33-cicd/rc_contract.py \
              --artifact "/tmp/mo7-build/out/${{ steps.build.outputs.artifact }}" \
              --commit "$GITHUB_SHA" \
              --install \
              --evidence /tmp/mo7-build/out/artifact-contract.json

      - name: Artifact security scan
        continue-on-error: ${{ !inputs.strict }}
        id: scan
        run: |
          set -euo pipefail
          python docs-for-user/phase33-cicd/rc_stage.py \
            --stage "the artifact scan is clean" \
            --evidence /tmp/mo7-build/stage-scan.json \
            --log /tmp/mo7-build/scan.log \
            --failure-hint "the artifact carries forbidden material, or the scan itself could not run" \
            -- python docs-for-user/phase33-cicd/rc_scan.py \
              --artifact "/tmp/mo7-build/out/${{ steps.build.outputs.artifact }}" \
              --evidence /tmp/mo7-build/out/artifact-scan.json

      - name: Reproducibility check (second independent build)
        continue-on-error: ${{ !inputs.strict }}
        id: repro
        env:
          MO7_BUILD_PYTHON: python
          MO7_FONT_MOCK: /tmp/mo7-build/font-mock.cjs
          MO7_FONT_DIR: /tmp/mo7-build/fonts
        run: |
          # Wrapped in rc_stage.py: this stage writes its result document before it
          # prints, so a crash in that window would leave a green document and a red
          # step, and the run would still be called releasable. The wrapper records
          # the exit status itself, and the assembler gates on that document.
          set -euo pipefail
          python docs-for-user/phase33-cicd/rc_stage.py \
            --stage "a second build is content-identical" \
            --evidence /tmp/mo7-build/stage-repro.json \
            --log /tmp/mo7-build/repro.log \
            --failure-hint "a second build of the same commit differed in a way the comparison could not explain, or the comparison itself failed" \
            -- bash -c '
                 set -euo pipefail
                 bash docs-for-user/phase33-cicd/rc_build.sh \
                   --checkout "$GITHUB_WORKSPACE" --out /tmp/mo7-build/out-b \
                   > /tmp/mo7-build/out-b.log 2>&1 || { tail -20 /tmp/mo7-build/out-b.log; exit 1; }
                 python docs-for-user/phase33-cicd/rc_manifest.py \
                   --compare "/tmp/mo7-build/out/${{ steps.build.outputs.artifact }}" \
                             "/tmp/mo7-build/out-b/${{ steps.build.outputs.artifact }}" \
                   --json-out /tmp/mo7-build/out/reproducibility.json \
                   | tee /tmp/mo7-build/out/reproducibility.txt
               '

      # -------------------------------------------------------------- evidence
      - name: Assemble release evidence
        id: rc
        if: always()
        env:
          STRICT: ${{ inputs.strict }}
        run: |
          # The assembler's exit status is the pipeline's verdict, and the
          # evidence below is read whether or not it refused the candidate: the
          # outputs (rc_id, verdict) and the committed documents are the record.
          set -uo pipefail
          assembler_exit=0
          python docs-for-user/phase33-cicd/rc_evidence.py \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --workflow "Release Pipeline" \
            --build-report /tmp/mo7-build/out/build-report.json \
            --contract /tmp/mo7-build/out/artifact-contract.json \
            --scan /tmp/mo7-build/out/artifact-scan.json \
            --reproducibility /tmp/mo7-build/out/reproducibility.txt \
            --reproducibility-json /tmp/mo7-build/out/reproducibility.json \
            --raw /tmp/mo7-build/out/build-report.json \
            --raw /tmp/mo7-build/out/artifact-contract.json \
            --raw /tmp/mo7-build/out/artifact-scan.json \
            --raw /tmp/mo7-build/out/reproducibility.json \
            --raw /tmp/mo7-build/out/artifact-manifest.json.gz \
            --raw /tmp/mo7-build/lint-product.json \
            --raw /tmp/mo7-build/lint-repo.json \
            --pytest-report pytest-report.xml \
            --bandit-summary bandit-summary.json \
            --stage /tmp/mo7-build/stage-source.json \
            --stage /tmp/mo7-build/stage-deps.json \
            --stage /tmp/mo7-build/stage-imports.json \
            --stage /tmp/mo7-build/stage-pipcheck.json \
            --stage /tmp/mo7-build/stage-npm.json \
            --stage /tmp/mo7-build/stage-frontend.json \
            --stage /tmp/mo7-build/stage-contract.json \
            --stage /tmp/mo7-build/stage-scan.json \
            --stage /tmp/mo7-build/stage-repro.json \
            --lint-product /tmp/mo7-build/lint-product.json \
            --lint-repo /tmp/mo7-build/lint-repo.json \
            --out "evidence/ci/$GITHUB_RUN_ID" || assembler_exit=$?
          cat "evidence/ci/$GITHUB_RUN_ID/release-candidate.json" | head -40
          python -c 'import json,pathlib,os;root=pathlib.Path("evidence/ci")/os.environ["GITHUB_RUN_ID"];rc=json.loads((root/"release-candidate.json").read_text());print("rc_id="+rc["rc_id"]);print("verdict="+rc["verdict"])' >> "$GITHUB_OUTPUT"
          tail -2 "$GITHUB_OUTPUT"
          exit "$assembler_exit"

      - name: Publish the pipeline summary
        if: always()
        run: |
          python docs-for-user/phase33-cicd/rc_evidence.py --summary "evidence/ci/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit the evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name "MO7 Release Pipeline"
          git config user.email "release-pipeline@users.noreply.github.com"
          git add "evidence/ci/$GITHUB_RUN_ID" || true
          if git diff --cached --quiet; then
            echo "no evidence to commit"
          else
            git commit -m "ci(release): evidence for run $GITHUB_RUN_ID (${GITHUB_SHA:0:7}) [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Fail closed when the candidate is not releasable
        if: always()
        env:
          VERDICT: ${{ steps.rc.outputs.verdict }}
        run: |
          echo "release candidate verdict: ${VERDICT:-UNKNOWN}"
          if [ "${VERDICT:-}" = "RELEASABLE" ]; then
            echo "the candidate is releasable and may be promoted by the release controller"
            exit 0
          fi
          echo "the pipeline fails closed: an unreleasable candidate must not be promoted"
          exit 1
